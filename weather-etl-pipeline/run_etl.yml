name: Automated Weather ETL Pipeline

on:
  schedule:
    # Runs automatically every day at 08:00 UTC (1:30 PM IST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to trigger a run manually with one click!

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ETL Pipeline
        run: python etl_pipeline.py

      - name: Commit and push updated database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add weather_pipeline.db
          git commit -m "Automated ETL run: Update weather database" || exit 0
          git push